services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: komame-prod-app
    restart: always
    ports:
      - "3080:3080"
    environment:
      DATABASE_URL: postgresql://komame_prod_user:${POSTGRES_PASSWORD}@postgres:5532/komame_prod_db
      PORT: 3080
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: komame-prod-postgres
    restart: always
    command: -p 5532
    environment:
      POSTGRES_USER: komame_prod_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: komame_prod_db
    volumes:
      - komame_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5532 -U komame_prod_user -d komame_prod_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  komame_prod_data:
