services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: komame-prod-app
    restart: unless-stopped
    ports:
      - "3080:3080"
    environment:
      NODE_ENV: production
      PORT: 3080
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-komame_prod_user}:${POSTGRES_PASSWORD}@postgres:5532/${POSTGRES_DB:-komame_prod_db}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      DEFAULT_HOUSEHOLD_NAME: ${DEFAULT_HOUSEHOLD_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: komame-prod-postgres
    restart: unless-stopped
    command: -p 5532
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-komame_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-komame_prod_db}
      TZ: Asia/Tokyo
    volumes:
      - komame_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5532 -U $${POSTGRES_USER:-komame_prod_user} -d $${POSTGRES_DB:-komame_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  komame_prod_data:
